name: followup-cron

# 9h e 14h (Brasília), segunda a sexta: mesma rodada do agent-loop, priorizando prospects em silêncio longo.
on:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

concurrency:
  group: agent-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a Edge Function agent-loop (followup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 170 -X POST "$SUPABASE_URL/functions/v1/agent-loop" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"followup": true}'
