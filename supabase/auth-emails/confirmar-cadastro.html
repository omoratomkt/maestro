<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111;line-height:1.5">
  <p style="font-size:13px;color:#666;margin:0 0 20px">Maestro · Morato</p>
  <h2 style="margin:0 0 14px;font-size:20px">Confirme seu cadastro</h2>
  <p style="margin:0 0 14px;font-size:15px">Para ativar a sua conta no Maestro, confirme o seu email:</p>
  <p style="margin:22px 0">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111;color:#fff;padding:11px 20px;border-radius:6px;text-decoration:none;font-size:15px">Confirmar email</a>
  </p>
  <p style="margin:0 0 14px;font-size:12px;color:#666">Se o botão não abrir, copie e cole este endereço no navegador:<br><span style="word-break:break-all">{{ .ConfirmationURL }}</span></p>
  <p style="margin:18px 0 0;font-size:12px;color:#666">Se você não criou uma conta, ignore este email.</p>
</div>
